[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "freudenthal-potentials"
version = "0.2.0"
description = "Vertex-star-supported polynomial potential bases on Freudenthal meshes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
keywords = ["finite-elements", "Freudenthal", "Bernstein", "curl", "local-basis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=2.0", "scipy>=1.12"]

[project.urls]
Homepage = "https://github.com/yuiyuiui/freudenthal-potentials"
Documentation = "https://github.com/yuiyuiui/freudenthal-potentials/blob/main/docs/api.md"
Source = "https://github.com/yuiyuiui/freudenthal-potentials"
Issues = "https://github.com/yuiyuiui/freudenthal-potentials/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
validation = ["sympy>=1.12", "pytest>=8", "matplotlib>=3.8", "ruff>=0.9", "build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["freudenthal*"]
namespaces = false

[tool.setuptools.package-data]
freudenthal = ["CERTIFICATES.md", "certificates/*", "_certificate_check/**/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["src/freudenthal/_certificate_check", "numerical_case/results"]
